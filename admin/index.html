<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Administración · Altas de clientes · Corti-Fer</title>
  <meta name="theme-color" content="#E11B2A">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png?v=3.3">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png?v=3.3">
  <link rel="preload" as="image" href="../assets/img/logo.png?v=3.3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,600;0,700;1,700&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css?v=3.3">
  <link rel="stylesheet" href="../assets/css/admin.css?v=3.3">
</head>
<body>
  <header class="masthead">
    <div class="wrap wide">
      <div class="brand"><img src="../assets/img/logo.png?v=3.3" width="720" height="143" alt="Corti-Fer"><span class="tag">Altas de clientes</span></div>
      <button type="button" class="btn sm" id="logout" hidden>Salir</button>
    </div>
  </header>

  <div class="wrap wide">
    <section id="login" class="login card" hidden>
      <h2>Administración</h2>
      <p class="lead">Ingresá la clave de administración para ver las solicitudes.</p>
      <form id="loginForm">
        <div class="f">
          <label for="clave">Clave</label>
          <input id="clave" type="password" autocomplete="current-password" required>
        </div>
        <p class="errtxt" id="loginErr" role="alert" hidden></p>
        <button class="btn pri" id="loginBtn" type="submit">Ingresar</button>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="banner bad" id="verWarn" role="alert" hidden></div>
      <div class="metrics" id="metrics" aria-label="Indicadores"></div>
      <div class="toolbar">
        <div class="search"><input id="q" type="search" placeholder="Buscar por razón social, CUIT, email, vendedor, solicitud o N° de cliente" aria-label="Buscar"></div>
        <select id="fEstado" aria-label="Filtrar por estado"></select>
        <button type="button" class="btn" id="refresh">Actualizar</button>
      </div>
      <div class="adm">
        <div class="list" id="list" aria-label="Solicitudes"></div>
        <div class="card" id="detail"></div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../assets/js/config.js?v=3.3"></script>
  <script src="../assets/js/common.js?v=3.3"></script>
  <script src="../assets/js/admin.js?v=3.3"></script>
</body>
</html>
